<ul>
    {% for item in include.collection %}
        <li>
            {% if item.url %}
                <a href="{{ item.url }}" {% if item.newTab %}target="_blank" rel="noopener noreferrer"{% endif %}>{{ item.title }}</a>
            {% else %}
                {{ item.title }}
            {% endif %}
        </li>
    {% endfor %}
</ul>
