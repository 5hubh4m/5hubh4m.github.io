<ul>
    {% for item in include.collection %}
      <li>
        <h4><a href="{{ item.url }}" target="_blank" rel="noopener noreferrer">{{ item.name }}</a></h4>
        <p><code>{{ item.languages | join: "</code>, <code>" }}</code></p>   
        <p>{{ item.description }}</p>
      </li>
    {% endfor %}
</ul>
