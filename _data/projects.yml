entries:
- name: 'Higher Level Abstractions for One-Sided RDMA Applications'
  languages:
  - Distributed Systems
  - RDMA
  - Data Center
  description: >-
    RDMA has emerged as a likey contender for tackling the widening gap
    between single-core CPU performance and data center networking interconnect
    bandwidth. However, the mismatch between low-level RDMA operations (READ, CAS)
    and high-level distributed application requirements (fault-tolerance, linearizability)
    makes it hard to efficiently utilize RDMA and unlock it's full performance advantages.
    In this project, we propose higher level abstractions for RDMA that bridge this gap.
- name: 'Fast Replica Coordination with <font style="font-variant-caps: small-caps">Zip</font>'
  languages:
  - Distributed Systems
  - RDMA
  - Consensus
  - SMR
  description: >-
    State Machine Replication (SMR) is an essential abstraction for building
    reliable distributed applications. Existing protocols that implement SMR
    have high-overheads in terms of both throughput and latency, preventing
    efficient utilization of modern data center networking hardware. We propose
    a new protocol, <font style="font-variant-caps: small-caps">Zip</font>, that
    provides the same abstraction as SMR to the clients of a replicated service,
    but performs replication in 1-RTT in the absence of failures and asynchrony,
    using a combination of speculative agreement and off-path ordering. We also
    built two applications, <font style="font-variant-caps: small-caps">Ziplog</font>,
    a shared log that provides high-throughput and low-latency and
    <font style="font-variant-caps: small-caps">Zipkvs</font>, a state-of-the-art
    transactional key-value store that use <font style="font-variant-caps: small-caps">Zip</font>
    as the underlying replication protocol.
    <br/><br/>This work is under submission at EuroSys '26.
- name: Understanding Host Network Stack Overheads
  url: https://github.com/Terabit-Ethernet/terabit-network-stack-profiling
  languages:
  - Systems
  - Networking
  description: >-
    Adoption of high-bandwidth access links (100 Gbps and beyond) in the data center
    has led to a shift in the bottlnecks from the network core to end-host processing.
    We perform exhaustive benchmarking of the Linux network stack and analyse several
    metrics like throughput, CPU utilisation, cache miss rate, to understand (1) the
    impact of offloads present in commodity NICs on performance, and (2) the causes of
    overheads in the existing network stacks; and provide recommendations for the design
    of future transport protocols, network stacks, and network hardware.
    <br/><br/>I talked about this project at <a href="https://netdevconf.info/0x15/session.html?Understanding-Linux-Network-Stack-Overheads-for-High-Speed-Networks">NetDev 0x15</a>.
    It was also published at <a href="publications">SIGCOMM '21</a>.
- name: Gandiva
  url: https://www.microsoft.com/en-us/research/publication/balancing-efficiency-and-fairness-in-heterogeneous-gpu-clusters-for-deep-learning/
  languages:
  - Systems for Deep Learning
  - Scheduling
  - Fairness
  description: >-
    Gandiva is a Cluster Scheduler for Deep Learning utilising CPU Scheduling-like
    primitives eg. timeslicing at minute-scales, and migration to schedule GPUs
    efficiently by providing coarse-grained GPU sharing across jobs. Gandiva<sub><em>fair</em></sub>
    is a scheduler built on top of Gandiva to provide cluster level fair share of GPU throughput.
    It also uses differential speedups obtained by different models on heterogeneous GPU architectures and an automatic
    trading policy based on second-price auctions to improve overall cluster throughput.
    <br/><br/>This work was published at <a href="publications">EuroSys '20</a>. This research
    was also incorporated in <a href="https://www.microsoft.com/en-us/research/publication/singularity-planet-scale-preemptive-and-elastic-scheduling-of-ai-workloads/">Microsoft's Project Singularity<a/>.
